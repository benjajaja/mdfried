name: screenshots

on:
  workflow_run:
    workflows: ["Test and Build"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-screenshots-master:
    name: Deploy master screenshots to external repo
    runs-on: ubuntu-latest
    # Only for push to master, and only if CI succeeded
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download screenshots artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: screenshots
          path: .
          github_token: ${{ github.token }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.SCREENSHOTS_PAT }}
          external_repository: benjajaja/mdfried-screenshots
          publish_dir: ./result
          publish_branch: gh-pages

  comment-pr-diffs:
    name: Upload diffs and comment on PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
      contents: write
    steps:
      - name: Download screenshots artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: screenshots
          path: .
          github_token: ${{ github.token }}

      # The artifact is produced by PR code and must not be trusted for anything
      # that decides where we write: take the PR number from GitHub's metadata.
      - name: Get PR number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          n="$RUN_PR"
          if [ -z "$n" ]; then
            # empty for PRs from forks (and the commit->pulls API doesn't know fork commits)
            n=$(gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number" | head -n1)
          fi
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::could not determine PR number for $HEAD_SHA"
            exit 1
          fi
          echo "PR_NUMBER=$n" >> "$GITHUB_ENV"

      # Free image hosts (catbox etc.) reject GitHub's runner IPs, so host the
      # images as assets of a rolling prerelease on this repo instead.
      - name: Upload images as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=pr-screenshots
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease --target "${{ github.event.repository.default_branch }}" \
            --title "PR screenshots" \
            --notes "Images for PR comments, managed by CI. Safe to delete."
          mkdir -p upload
          cp result/body.html comment.html
          for file in result/diffs/*.png result/images/*.png; do
            [ -f "$file" ] && [ ! -L "$file" ] || continue
            base=$(basename "$file")
            if ! [[ "$base" =~ ^[A-Za-z0-9._-]+\.png$ ]]; then
              echo "skipping unexpected file name: $base"
              continue
            fi
            relpath="${file#result/}"
            name="pr${PR_NUMBER}-${base}"
            cp "$file" "upload/$name"
            url="https://github.com/${GH_REPO}/releases/download/${TAG}/${name}"
            echo "$relpath -> $url"
            sed -i "s|IMAGE_BASE_URL/${relpath}|${url}|g" comment.html
          done
          gh release upload "$TAG" upload/*.png --clobber

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ env.PR_NUMBER }}
          path: comment.html
